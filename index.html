<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Project DIGITAL SPECIES — Artificial Life Simulator</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0b0c10; color: #e8e8e8; font-family: system-ui, -apple-system, sans-serif; }
  #sim { display: block; width: 100vw; height: 100vh; background: #05070a; touch-action: none; }
  .hud { position: absolute; top: 10px; left: 10px; right: 10px;
    background: rgba(10, 12, 18, 0.75); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 8px 12px; font-size: 13px; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px 14px; z-index: 10; }
  .hud .k { color: #889; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .hud .v { color: #fff; font-variant-numeric: tabular-nums; }
  .controls { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(10, 12, 18, 0.8); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px;
    align-items: center; z-index: 10; width: min(96vw, 460px); z-index: 20; }
  .row { width: 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  button { flex: 1 1 130px; min-width: 110px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06);
    color: #e8e8e8; font-size: 13px; cursor: pointer; }
  button:active { background: rgba(255,255,255,0.18); }
  button.primary { background: #22c55e; border-color: #22c55e; color: #000; font-weight: 600; }
  button.primary:active { background: #4ade80; }
  label { font-size: 11px; color: #889; white-space: nowrap; }
  input { flex: 1; min-width: 90px; padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.3); color: #e8e8e8; font-size: 12px; }
  input[type=range] { accent-color: #22c55e; }
  .title { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    font-size: 16px; font-weight: 700; letter-spacing: 0.05em; color: #22c55e; z-index: 10;
    opacity: 0.75; }
  @media (max-width: 600px) {
    .controls { bottom: 8px; padding: 8px 10px; }
    .hud { top: 8px; padding: 6px 10px; font-size: 12px; }
    button { min-width: 95px; padding: 7px 10px; font-size: 12px; }
  }
</style>
</head>
<body>
<canvas id="sim"></canvas>
<div class="title">Project DIGITAL SPECIES — tap to pause/resume</div>
<div class="hud">
  <div><div class="k">Tick</div><div class="v" id="hud-tick">0</div></div>
  <div><div class="k">Population</div><div class="v" id="hud-pop">0</div></div>
  <div><div class="k">Births</div><div class="v" id="hud-births">0</div></div>
  <div><div class="k">Deaths</div><div class="v" id="hud-deaths">0</div></div>
  <div><div class="k">Species</div><div class="v" id="hud-species">0</div></div>
  <div><div class="k">Avg Energy</div><div class="v" id="hud-energy">0</div></div>
</div>
<div class="controls">
  <div class="row">
    <button class="primary" id="btn-play">Pause</button>
    <button id="btn-reset">Reset</button>
  </div>
  <div class="row">
    <label>Seed</label><input id="inp-seed" type="number" value="0">
    <label>Pop</label><input id="inp-pop" type="number" value="400">
    <label>World</label><input id="inp-world" type="text" value="80x60">
    <label>Speed</label><input id="inp-speed" type="range" min="1" max="90" value="50">
  </div>
</div>
<script type="module" src="./web.js"></script>
</body>
</html>
